name: Finalize HelperPayroll 0.4.3.0 Alpha 2

on:
  push:
    branches:
      - agent/helperpayroll-0.4.3.0-alpha2

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[alpha2 finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/helperpayroll-0.4.3.0-alpha2
          fetch-depth: 0

      - name: Apply exact tested source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .publish/hpay_alpha2_existing.patch.b64 | gzip -dc > /tmp/hpay-alpha2.patch
          git apply --check /tmp/hpay-alpha2.patch
          git apply /tmp/hpay-alpha2.patch

      - name: Verify tested source hashes
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local expected="$1" path="$2"
            actual="$(git hash-object "$path")"
            printf '%s  %s\n' "$actual" "$path"
            test "$actual" = "$expected"
          }
          check 90deb4670c99a6a5b59662b1ba9022b4d16d0440 gui/HelperPayrollMenu.xml
          check 1d3c799464782135ea5cb1196e205596e94a2731 modDesc.xml
          check 1945afbd57bfc9180c3d44380ee9d49925166535 scripts/HelperPayroll.lua
          check 968f8324f8dc641e0ea2123c11a0b65e14a1276f scripts/gui/HelperPayrollMenu.lua
          check 20cd6e1312ca0f1e448017473cdb8af96ccd2d3c scripts/HelperPayrollCompatibility.lua
          check d49fec5ad66ecc9c70c0a72e48a8e7e27d1b84fd scripts/HelperPayrollFarmScope.lua
          check c55111e59811e7172a101b64854ffcfd13787a87 scripts/HelperPayrollPublicAPI.lua
          check 566ed9ebf0392fd9252db09e4605cb69a54100bb scripts/HelperPayrollSnapshot.lua
          check 37074e83c1b5ce73a61ebce248b80141b7d1204c HelperPayroll_icon.dds
          check 2ac6620442c760d14405e120c5b7649d3e3f509f config/defaultPayrollConfig.xml
          check 8f25ef05cce47a339692df347159cd2c46f13127 gui/guiProfiles.xml

      - name: Finalize branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .publish
          rm -f .github/workflows/finalize-helperpayroll-alpha2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish HelperPayroll 0.4.3.0 Alpha 2 [alpha2 finalized]"
          git push origin HEAD:agent/helperpayroll-0.4.3.0-alpha2
