name: Apply HelperPayroll Alpha 2 source

on:
  pull_request:
    branches:
      - automation/alpha2-source-base

permissions:
  contents: write

jobs:
  apply-alpha2:
    if: github.head_ref == 'feature/expanded-helper-slot-api'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and verify exact Alpha 2 metadata patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/HelperPayroll.lua')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '-- Version: 0.4.2.0-alpha1': '-- Version: 0.4.2.0-alpha2',
              'HelperPayroll.RELEASE_CHANNEL = "alpha1"': 'HelperPayroll.RELEASE_CHANNEL = "alpha2"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one marker {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          rm -rf .bootstrap
          echo '705de3d38051b3e5f5265798dc9361e3dc4c1febbe4407832b1edb1f7c7212a3  modDesc.xml' | sha256sum -c -
          echo 'c594ed2f3a483f8b4d3fd878053f2d4c5268832af473e2937c9a88447346cfb0  scripts/HelperPayroll.lua' | sha256sum -c -
          grep -q -- '-- Version: 0.4.2.0-alpha2' scripts/HelperPayroll.lua
          grep -q 'RELEASE_CHANNEL = "alpha2"' scripts/HelperPayroll.lua
          grep -q 'Alpha 2' modDesc.xml

      - name: Commit exact Alpha 2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-alpha2-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Prepare HelperPayroll 0.4.2.0 Alpha 2'
          git push origin HEAD:${{ github.head_ref }}
