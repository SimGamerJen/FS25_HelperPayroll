name: Apply HelperPayroll Alpha 2 source

on:
  pull_request:
    branches:
      - automation/alpha2-source-base

permissions:
  contents: write

jobs:
  apply-alpha2:
    if: github.head_ref == 'feature/expanded-helper-slot-api'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and verify minimal Alpha 2 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/HelperPayroll.lua')
          text = path.read_text(encoding='utf-8')
          old = 'HelperPayroll.RELEASE_CHANNEL = "alpha1"'
          new = 'HelperPayroll.RELEASE_CHANNEL = "alpha2"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Alpha 1 release-channel marker, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          cat > modDesc.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8" standalone="no" ?>
          <modDesc descVersion="110">
              <author>SimGamerJen</author>
              <version>0.4.2.0</version>
              <title>
                  <en>Helper Payroll Alpha</en>
              </title>
              <description>
                  <en>0.4.2.0 Alpha 2: Extends HelperPayroll identity, role assignment, worker overrides and job-slot detection from A-J to A-T for the twenty-helper HelperProfiles roster. Existing A-J save mappings remain compatible. Alpha 2 records the completed A-T integration tests and retains job-start snapshots when roles or appearance bindings change during active work.</en>
              </description>
              <iconFilename>HelperPayroll_icon.dds</iconFilename>
              <multiplayer supported="false" />

              <l10n>
                  <text name="input_HELPERPAYROLL_CYCLE_ROLE">
                      <en>Helper Payroll: Cycle Role</en>
                  </text>
                  <text name="input_HELPERPAYROLL_TOGGLE_ROLE_LIST">
                      <en>Helper Payroll: Toggle Role List</en>
                  </text>
                  <text name="input_HELPERPAYROLL_TOGGLE_REPORT_OVERLAY">
                      <en>Helper Payroll: Toggle Report Overlay</en>
                  </text>
                  <text name="input_HELPERPAYROLL_TOGGLE_MANAGEMENT_MENU">
                      <en>Helper Payroll: Management Menu</en>
                  </text>
              </l10n>

              <actions>
                  <action name="HELPERPAYROLL_CYCLE_ROLE" category="ONFOOT VEHICLE" axisType="HALF" />
                  <action name="HELPERPAYROLL_TOGGLE_ROLE_LIST" category="ONFOOT VEHICLE" axisType="HALF" />
                  <action name="HELPERPAYROLL_TOGGLE_REPORT_OVERLAY" category="ONFOOT VEHICLE" axisType="HALF" />
                  <action name="HELPERPAYROLL_TOGGLE_MANAGEMENT_MENU" category="ONFOOT VEHICLE" axisType="HALF" />
              </actions>

              <inputBinding>
                  <actionBinding action="HELPERPAYROLL_CYCLE_ROLE">
                      <binding device="KB_MOUSE_DEFAULT" input="KEY_semicolon" />
                  </actionBinding>
                  <actionBinding action="HELPERPAYROLL_TOGGLE_ROLE_LIST">
                      <binding device="KB_MOUSE_DEFAULT" input="KEY_rctrl KEY_semicolon" />
                  </actionBinding>
                  <actionBinding action="HELPERPAYROLL_TOGGLE_REPORT_OVERLAY">
                      <binding device="KB_MOUSE_DEFAULT" input="KEY_rctrl KEY_p" />
                  </actionBinding>
                  <actionBinding action="HELPERPAYROLL_TOGGLE_MANAGEMENT_MENU">
                      <binding device="KB_MOUSE_DEFAULT" input="KEY_rctrl KEY_h" />
                  </actionBinding>
              </inputBinding>

              <extraSourceFiles>
                  <sourceFile filename="scripts/gui/HelperPayrollMenu.lua" />
                  <sourceFile filename="scripts/HelperPayroll.lua" />
              </extraSourceFiles>
          </modDesc>
          EOF
          sed -i 's/^          //' modDesc.xml

          rm -rf .bootstrap

          echo '705de3d38051b3e5f5265798dc9361e3dc4c1febbe4407832b1edb1f7c7212a3  modDesc.xml' | sha256sum -c -
          echo 'c594ed2f3a483f8b4d3fd878053f2d4c5268832af473e2937c9a88447346cfb0  scripts/HelperPayroll.lua' | sha256sum -c -
          grep -q 'RELEASE_CHANNEL = "alpha2"' scripts/HelperPayroll.lua
          grep -q 'Alpha 2' modDesc.xml
          grep -q '<version>0.4.2.0</version>' modDesc.xml

      - name: Commit exact Alpha 2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-alpha2-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Prepare HelperPayroll 0.4.2.0 Alpha 2'
          git push origin HEAD:${{ github.head_ref }}
